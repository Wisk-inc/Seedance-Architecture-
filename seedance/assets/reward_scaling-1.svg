<text x="145" y="861.6" fill="#6B7079" font-size="14" font-weight="600">solid = measured by this harness</text>
<rect x="145" y="871.6" width="14" height="11" rx="2" fill="#171A20"/><rect x="145" y="871.6" width="14" height="11" rx="2" fill="url(#unmeasured)"/><text x="167" y="880.6" fill="#6B7079" font-size="14">hatched = published (RewardDance, arXiv:2509.08826)</text>
<text x="145" y="907.6" fill="#6B7079" font-size="13">Bigger reward models keep reward variance high</text>
<text x="145" y="929.6" fill="#6B7079" font-size="13">during RL, which is the mechanism that resists</text>
<text x="145" y="951.6" fill="#6B7079" font-size="13">reward hacking and mode collapse. This is why</text>
<text x="145" y="973.6" fill="#6B7079" font-size="13">the ceiling on RLHF quality is set by the reward</text>
<text x="145" y="995.6" fill="#6B7079" font-size="13">model, not the generator.</text>
