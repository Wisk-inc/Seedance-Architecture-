<text x="197" y="927.8" fill="#6B7079" font-size="14" font-weight="600">solid = measured by this harness</text>
<rect x="197" y="937.8" width="14" height="11" rx="2" fill="#171A20"/><rect x="197" y="937.8" width="14" height="11" rx="2" fill="url(#unmeasured)"/><text x="219" y="946.8" fill="#6B7079" font-size="14">hatched = published (Physics-IQ, arXiv:2501.09038)</text>
<text x="197" y="973.8" fill="#6B7079" font-size="13">396 real videos, 66 scenarios, 3 perspectives.</text>
<text x="197" y="995.8" fill="#6B7079" font-size="13">The paper's finding: physical understanding is</text>
<text x="197" y="1017.8" fill="#6B7079" font-size="13">severely limited and unrelated to visual</text>
<text x="197" y="1039.8" fill="#6B7079" font-size="13">realism. Only the VideoPoet figure is quoted</text>
<text x="197" y="1061.8" fill="#6B7079" font-size="13">here because it is the one this repo can cite;</text>
<text x="197" y="1083.8" fill="#6B7079" font-size="13">run `seedance bench` on your own generations to</text>
<text x="197" y="1105.8" fill="#6B7079" font-size="13">add measured bars.</text>
